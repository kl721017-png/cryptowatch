<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoTrade Radar</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--line:#dfe7f3;--text:#172033;--muted:#7b8ba8;--blue:#2457d6;--green:#10a76a;--red:#e2485e;--orange:#e69a21;--purple:#7c3aed;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;font-size:14px}button,input,select{font:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 1px 5px rgba(20,30,60,.05)}.brand{font-weight:900;letter-spacing:.5px;font-size:20px;background:linear-gradient(90deg,#2255cc,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8fbff;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px}.btn{border:0;border-radius:10px;padding:8px 13px;cursor:pointer;background:#edf2fb;color:#41506b}.btn.primary{background:linear-gradient(90deg,#2457d6,#3d7af0);color:#fff}.btn.danger{background:#fff0f2;color:var(--red);border:1px solid #f2c6cd}.wrap{padding:20px 22px 50px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 16px;border-radius:12px;cursor:pointer}.tab.active{background:#eaf0fb;color:#1a2a49;font-weight:700}.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.tf{display:flex;gap:4px;background:#e9eef7;border:1px solid var(--line);border-radius:12px;padding:4px}.tf button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 14px;cursor:pointer;font-size:13px}.tf button.active{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(20,30,60,.12)}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(20,30,60,.05);overflow:hidden}.table{width:100%;border-collapse:collapse;min-width:1160px}.table th{position:static;background:#fbfcff;color:#7d8aa6;font-size:11px;letter-spacing:.5px;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--line);z-index:1}.table td,.table th{padding:12px 14px;border-bottom:1px solid #eef3fa;vertical-align:top}.table tr:hover{background:#f8fbff}.right{text-align:right}.center{text-align:center}.sym{display:flex;gap:10px;align-items:center}.coinIcon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1.5px solid}.small{font-size:12px;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}.badge.green{background:#eaf9f2;color:#08784b}.badge.red{background:#fff0f2;color:#c52d42}.badge.orange{background:#fff7e8;color:#985f00}.badge.purple{background:#f1ecff;color:#6335c3}.badge.gray{background:#eef2f7;color:#687891}.score{display:flex;flex-direction:column;gap:5px;min-width:86px}.scoreline{height:6px;background:#e8eef7;border-radius:6px;overflow:hidden}.scorefill{height:100%;border-radius:6px;transition:width .5s}.reason{font-size:12px;color:#5d6c86;line-height:1.5;max-width:300px}.inputrow{display:flex;gap:8px;margin-bottom:14px}.inputrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.coins{display:flex;gap:8px;flex-wrap:wrap}.coinTag{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#f8fbff;border-radius:999px;padding:6px 10px;font-size:13px}.x{border:0;background:none;color:var(--red);cursor:pointer;font-size:16px}.status{margin:10px 0;color:var(--muted);font-size:12px}.dropdown{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:5px;box-shadow:0 10px 24px rgba(20,30,60,.12);z-index:30;max-height:260px;overflow:auto}.result{padding:10px 12px;border-bottom:1px solid #eef3fa;cursor:pointer}.result:hover{background:#f4f8ff}.result:last-child{border-bottom:0}.hide{display:none!important}@media(max-width:900px){.wrap{padding:14px}.top{padding:12px 14px}.brand{font-size:17px}.card{overflow:auto}}
</style>
</head>
<body>
<header class="top">
  <div><span class="brand">◈ AUTOTRADE RADAR</span> <span id="sync" class="pill mono">啟動中…</span></div>
  <button class="btn" onclick="refreshAll()">↻ 重新整理</button>
</header>
<main class="wrap">
  <div class="tabs">
    <button id="tabRadar" class="tab active" onclick="showPage('radar')">商品池雷達</button>
    <button id="tabCoins" class="tab" onclick="showPage('coins')">幣種管理</button>
  </div>
  <section id="pageRadar">
    <div class="bar">
      <div style="display:flex;align-items:center;gap:10px"><span class="small mono">K線週期</span><div class="tf mono"><button id="tf-1H" class="active" onclick="setTf('1H')">1H</button><button id="tf-4H" onclick="setTf('4H')">4H</button><button id="tf-1D" onclick="setTf('1D')">1D</button></div></div>
      <div class="legend"><span><i class="dot" style="background:var(--green)"></i>可加入</span><span><i class="dot" style="background:var(--purple)"></i>觀察</span><span><i class="dot" style="background:var(--red)"></i>排除</span><span><i class="dot" style="background:var(--orange)"></i>BB 2~4% 陷阱區</span></div>
    </div>
    <div class="card"><div style="overflow:auto"><table class="table mono"><thead><tr><th>幣種</th><th class="right">價格</th><th class="right">24H</th><th class="right">24H成交額</th><th class="right">RSI</th><th class="right">ADX</th><th class="right">ATR%</th><th class="right">BB寬%</th><th>分數</th><th>方向</th><th>原因</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="12" class="center small">載入中…</td></tr></tbody></table></div></div>
    <div class="small" style="text-align:right;margin-top:10px">資料來源：CryptoCompare API · 價格每 60 秒 · 指標每 10 分鐘更新 · 已移除 LINE / 警報 / 音效功能</div>
  </section>
  <section id="pageCoins" class="hide" style="max-width:760px">
    <div class="card" style="padding:18px;margin-bottom:18px;overflow:visible"><h3 style="margin:0 0 12px">新增幣種</h3><div class="inputrow"><div style="position:relative;flex:1"><input id="q" placeholder="輸入幣種代號，例如 PEPE、LINK、UNI" oninput="queueSearch()" onkeydown="if(event.key==='Enter')searchCoin()"><div id="dropdown" class="dropdown hide"></div></div><button class="btn primary" onclick="searchCoin()">搜尋</button></div><div id="searchStatus" class="status"></div></div>
    <div class="card" style="padding:18px"><div class="bar" style="margin-bottom:12px"><h3 style="margin:0">目前追蹤 <span id="count" class="small"></span></h3><button class="btn danger" onclick="resetCoins()">重置預設</button></div><div id="coinList" class="coins"></div></div>
    <p class="small">幣種資料儲存在瀏覽器 localStorage。分享給朋友時，他們的清單不會和你的互相影響。</p>
  </section>
</main>
<script>
const PROXY = "https://line-proxy-c1em.onrender.com"; // 若你部署新的 Render，改成新的 Render URL
const MAX_COINS = 20;
const DEFAULT_COINS = [{sym:"BTC",name:"Bitcoin"},{sym:"ETH",name:"Ethereum"},{sym:"SOL",name:"Solana"},{sym:"BNB",name:"BNB"},{sym:"XRP",name:"XRP"}];
const COLORS = ["#f7931a","#627eea","#9945ff","#f3ba2f","#00aae4","#2775ca","#e84142","#e84393","#16c784","#0033ad","#ff0420","#26a17b"];
let coins = loadCoins(), prices = {}, klines = {}, tf = "1H", timer = null, results = [];
function loadCoins(){try{return JSON.parse(localStorage.getItem("cw_watchlist") || localStorage.getItem("cw_coins3")) || structuredClone(DEFAULT_COINS)}catch(e){return structuredClone(DEFAULT_COINS)}}
function saveCoins(){localStorage.setItem("cw_watchlist", JSON.stringify(coins));}
function showPage(p){document.getElementById("pageRadar").classList.toggle("hide",p!=="radar");document.getElementById("pageCoins").classList.toggle("hide",p!=="coins");document.getElementById("tabRadar").classList.toggle("active",p==="radar");document.getElementById("tabCoins").classList.toggle("active",p==="coins"); if(p==="coins") renderCoins();}
function setTf(v){tf=v;["1H","4H","1D"].forEach(x=>document.getElementById("tf-"+x).classList.toggle("active",x===v)); renderRows();}
function fmtPrice(n){if(n==null)return"—"; if(n>=1000)return"$"+n.toLocaleString("en-US",{maximumFractionDigits:2}); if(n>=1)return"$"+n.toFixed(4); return"$"+n.toFixed(6)}
function fmtPct(n){if(n==null)return"—"; return (n>=0?"+":"")+n.toFixed(2)+"%"}
function fmtVol(n){if(n==null)return"—"; if(n>=1e9)return"$"+(n/1e9).toFixed(2)+"B"; if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M"; return"$"+Math.round(n).toLocaleString()}
function calcRSI(c,p=14){if(c.length<p+1)return null;let ag=0,al=0;for(let i=1;i<=p;i++){let d=c[i]-c[i-1];if(d>=0)ag+=d;else al-=d}ag/=p;al/=p;for(let i=p+1;i<c.length;i++){let d=c[i]-c[i-1];ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p}return al===0?100:+(100-100/(1+ag/al)).toFixed(2)}
function calcADX(o,p=14){if(o.length<p*2+1)return null;let tr=[],pd=[],md=[];for(let i=1;i<o.length;i++){let h=o[i].high,l=o[i].low,pc=o[i-1].close,ph=o[i-1].high,pl=o[i-1].low;tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));let up=h-ph,dn=pl-l;pd.push(up>dn&&up>0?up:0);md.push(dn>up&&dn>0?dn:0)}function w(a){let s=0,r=[];for(let i=0;i<p;i++)s+=a[i];r.push(s);for(let i=p;i<a.length;i++){s=s-s/p+a[i];r.push(s)}return r}let st=w(tr),sp=w(pd),sm=w(md);let dx=st.map((t,i)=>{if(!t)return 0;let a=sp[i]/t*100,b=sm[i]/t*100;return Math.abs(a-b)/(a+b)*100});let adx=0;for(let i=dx.length-p;i<dx.length;i++)adx+=dx[i];let last=st.length-1;return {adx:+(adx/p).toFixed(2), plusDI:+(sp[last]/st[last]*100).toFixed(2), minusDI:+(sm[last]/st[last]*100).toFixed(2)}}
function calcATR(o,p=14){if(o.length<p+1)return null;let trs=[];for(let i=1;i<o.length;i++){let h=o[i].high,l=o[i].low,pc=o[i-1].close;trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}let s=trs.slice(-p).reduce((a,b)=>a+b,0)/p;return +(s/o[o.length-1].close*100).toFixed(2)}
function calcBB(c,p=20){if(c.length<p)return null;let x=c.slice(-p),ma=x.reduce((a,b)=>a+b,0)/p,sd=Math.sqrt(x.reduce((a,b)=>a+(b-ma)**2,0)/p);return +((ma+2*sd-(ma-2*sd))/ma*100).toFixed(2)}
function evaluate(sym){let k=klines[sym]?.[tf]; if(!k||k.length<30)return null;let closes=k.map(x=>x.close), rsi=calcRSI(closes), adx=calcADX(k), atr=calcATR(k), bb=calcBB(closes), p=prices[sym]; if(rsi==null||!adx||atr==null||bb==null)return null;let score=0,reasons=[];let vol=p?.vol24h||0;if(vol>=30000000){score+=15;reasons.push("成交額達標")}else{score-=15;reasons.push("成交額不足")}
if(adx.adx>=25&&adx.adx<=40){score+=20;reasons.push("ADX健康趨勢")}else if(adx.adx>40){score+=5;reasons.push("ADX偏過熱")}else if(adx.adx>=20){score+=8;reasons.push("ADX弱趨勢")}else{score-=10;reasons.push("ADX盤整")}
if(bb>=4&&bb<=8){score+=20;reasons.push("BB進入趨勢區")}else if(bb>=2&&bb<4){score-=25;reasons.push("BB 2~4%陷阱區")}else if(bb>8){score-=15;reasons.push("BB過熱")}else{score-=10;reasons.push("BB過窄")}
if(atr>=1&&atr<=6){score+=15;reasons.push("ATR波動合理")}else if(atr>8){score-=10;reasons.push("ATR過高")}else if(atr<0.5){score-=10;reasons.push("ATR過低")}else{score+=5;reasons.push("ATR尚可")}
let dir="多空併行"; if(adx.plusDI>adx.minusDI&&rsi>=50){score+=15;dir="只做多";reasons.push("+DI與RSI偏多")}else if(adx.minusDI>adx.plusDI&&rsi<50){score+=15;dir="只做空";reasons.push("-DI與RSI偏空")}else{score+=5;reasons.push("方向未完全一致")}
if(rsi>70){score-=5;reasons.push("RSI偏熱")}else if(rsi<30){score-=5;reasons.push("RSI偏冷")}else{score+=10;reasons.push("RSI中性可交易")}
score=Math.max(0,Math.min(100,Math.round(score)));let sug=score>=75?"可加入":score>=55?"觀察":"排除";return {rsi,adx,atr,bb,score,dir,sug,reasons:reasons.slice(0,4)}}
function colorScore(s){return s>=75?"var(--green)":s>=55?"var(--purple)":s>=40?"var(--orange)":"var(--red)"}
function sugClass(s){return s==="可加入"?"green":s==="觀察"?"purple":"red"}
function renderRows(){let html=coins.map((c,i)=>{let p=prices[c.sym], e=evaluate(c.sym), col=COLORS[i%COLORS.length];let chg=p?.change24h, up=(chg||0)>=0;if(!e){return `<tr><td><div class="sym"><div class="coinIcon" style="background:${col}16;border-color:${col}66;color:${col}">${c.sym.slice(0,4)}</div><div><b>${c.sym}</b><div class="small">${c.name||""}</div></div></div></td><td class="right"><b>${fmtPrice(p?.price)}</b></td><td class="right" style="color:${up?'var(--green)':'var(--red)'}">${fmtPct(chg)}</td><td class="right">${fmtVol(p?.vol24h)}</td><td colspan="7" class="small">指標計算中…</td><td><button class="x" onclick="removeCoin('${c.sym}')">×</button></td></tr>`}
let sc=colorScore(e.score);return `<tr><td><div class="sym"><div class="coinIcon" style="background:${col}16;border-color:${col}66;color:${col}">${c.sym.slice(0,4)}</div><div><b>${c.sym}</b><div class="small">${c.name||""}</div></div></div></td><td class="right"><b>${fmtPrice(p?.price)}</b></td><td class="right" style="color:${up?'var(--green)':'var(--red)'}"><b>${fmtPct(chg)}</b></td><td class="right">${fmtVol(p?.vol24h)}</td><td class="right">${e.rsi.toFixed(1)}</td><td class="right">${e.adx.adx.toFixed(1)}<div class="small">+${e.adx.plusDI.toFixed(0)} / -${e.adx.minusDI.toFixed(0)}</div></td><td class="right">${e.atr.toFixed(2)}%</td><td class="right" style="color:${e.bb>=2&&e.bb<4?'var(--orange)':e.bb>=4&&e.bb<=8?'var(--green)':'var(--red)'}"><b>${e.bb.toFixed(2)}%</b></td><td><div class="score"><div><b style="color:${sc};font-size:16px">${e.score}</b> <span class="badge ${sugClass(e.sug)}">${e.sug}</span></div><div class="scoreline"><div class="scorefill" style="width:${e.score}%;background:${sc}"></div></div></div></td><td><span class="badge ${e.dir==='只做多'?'green':e.dir==='只做空'?'red':'purple'}">${e.dir}</span></td><td class="reason">${e.reasons.join('、')}</td><td><button class="x" onclick="removeCoin('${c.sym}')">×</button></td></tr>`}).join("");document.getElementById("rows").innerHTML=html||'<tr><td colspan="12" class="center small">尚無追蹤幣種</td></tr>'}
function renderCoins(){document.getElementById("count").textContent=`(${coins.length}/${MAX_COINS})`;document.getElementById("coinList").innerHTML=coins.map((c,i)=>`<span class="coinTag"><b>${c.sym}</b><span class="small">${c.name||""}</span><button class="x" onclick="removeCoin('${c.sym}')">×</button></span>`).join("")}
function removeCoin(sym){if(coins.length<=1){alert("至少保留一個幣種");return}coins=coins.filter(c=>c.sym!==sym);saveCoins();renderCoins();renderRows()}
function resetCoins(){if(confirm("重置為預設幣種？")){coins=structuredClone(DEFAULT_COINS);saveCoins();renderCoins();refreshAll()}}
function queueSearch(){clearTimeout(timer);let q=document.getElementById("q").value.trim();if(!q){document.getElementById("dropdown").classList.add("hide");return}timer=setTimeout(searchCoin,500)}
async function searchCoin(){let q=document.getElementById("q").value.trim();if(!q)return;document.getElementById("searchStatus").textContent="搜尋中…";try{let r=await fetch(`${PROXY}/search?query=${encodeURIComponent(q)}`);let d=await r.json();results=(d.coins||[]).slice(0,8);let dd=document.getElementById("dropdown");if(!results.length){dd.classList.add("hide");document.getElementById("searchStatus").textContent="找不到結果";return}dd.innerHTML=results.map((x,i)=>`<div class="result" onclick="addCoin(${i})"><b>${(x.symbol||'').toUpperCase()}</b> <span class="small">${x.name||''}</span></div>`).join("");dd.classList.remove("hide");document.getElementById("searchStatus").textContent=`找到 ${results.length} 個結果`;}catch(e){document.getElementById("searchStatus").textContent="搜尋失敗"}}
function addCoin(i){let c=results[i],sym=(c.symbol||"").toUpperCase();if(!sym)return;if(coins.find(x=>x.sym===sym)){document.getElementById("searchStatus").textContent=`${sym} 已在清單`;return}if(coins.length>=MAX_COINS){document.getElementById("searchStatus").textContent=`已達 ${MAX_COINS} 個上限`;return}coins.push({sym,name:c.name||sym});saveCoins();document.getElementById("q").value="";document.getElementById("dropdown").classList.add("hide");document.getElementById("searchStatus").textContent=`已新增 ${sym}`;renderCoins();fetchPrices();fetchAllKlines(sym)}
async function fetchPrices(){try{let syms=coins.map(c=>c.sym).join(",");let r=await fetch(`${PROXY}/prices?symbols=${syms}`);let d=await r.json();if(d.RAW){Object.keys(d.RAW).forEach(sym=>{let x=d.RAW[sym]?.USD;if(x)prices[sym]={price:x.PRICE,change24h:x.CHANGEPCT24HOUR,vol24h:x.TOTALVOLUME24HTO}})}document.getElementById("sync").textContent=new Date().toLocaleTimeString("zh-TW")+" 更新";renderRows()}catch(e){document.getElementById("sync").textContent="價格更新失敗"}}
async function fetchKlines(sym,interval){try{let r=await fetch(`${PROXY}/klines?symbol=${sym}&interval=${interval}&limit=120`);let res=await r.json();let data=Array.isArray(res)?res:(res.Data&&res.Data.Data?res.Data.Data:[]);if(!Array.isArray(data)||data.length<30)return;klines[sym]=klines[sym]||{};klines[sym][interval]=data.map(x=>({open:+x.open,high:+x.high,low:+x.low,close:+x.close}));renderRows()}catch(e){}}
function fetchAllKlines(sym){["1H","4H","1D"].forEach(t=>fetchKlines(sym,t))}
function refreshAll(){fetchPrices();coins.forEach(c=>fetchAllKlines(c.sym));renderCoins();renderRows()}
refreshAll();setInterval(fetchPrices,60000);setInterval(()=>coins.forEach(c=>fetchAllKlines(c.sym)),10*60000);document.addEventListener("click",e=>{if(!e.target.closest("#q")&&!e.target.closest("#dropdown"))document.getElementById("dropdown").classList.add("hide")});
</script>
</body>
</html>
